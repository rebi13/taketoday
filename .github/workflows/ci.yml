name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # 커밋 메시지 검사에 PR의 base부터 이력이 필요하다
          fetch-depth: 0

      # pnpm 버전은 package.json의 packageManager를 따르고, pnpm install까지 한다
      - uses: pnpm/setup@v3
        with:
          runtime: node@22
          cache: true
          require-lockfile: true

      # 로컬 commit-msg 훅은 건너뛸 수 있으므로 PR에 들어온 커밋을 다시 검사한다
      - name: Commit messages
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm seed:validate
      - run: pnpm build
