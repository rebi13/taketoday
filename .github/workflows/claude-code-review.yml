name: Claude Code Review

# PR이 열리거나 커밋이 추가되면 Claude가 리뷰해 인라인 코멘트를 남긴다.
# 설정과 주의할 점은 docs/setup-code-review.md를 본다.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# 커밋을 연달아 올리면 이전 리뷰를 취소한다
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          # --comment: 리뷰를 PR 코멘트로 남긴다. 없으면 실행 로그에만 남는다
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # --allowedTools 줄은 지우지 않는다. 이 줄이 있어야 인라인 코멘트 도구가 켜진다
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --append-system-prompt "리뷰 코멘트는 한국어로 쓴다. 저장소의 CLAUDE.md와 docs/adr의 규칙(층 간 import, 도메인 규칙, UI 규칙, 문구 원칙)을 기준으로 본다."
